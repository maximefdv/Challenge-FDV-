<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Souffleur</title>
<style>
  :root {
    --bg: #0c0e14; --surface: #141824; --surface-2: #1b2030; --line: #262c3d; --text: #eef0f6; --muted: #8a92a8; --soft: #b8bfd1;
    --brand: #7c6cff; --brand-2: #22d3ee;
    --objection: #ff8a4c; --question: #4ea8ff; --signal: #34d399; --danger: #ff6b6b;
    --radius: 14px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f4f8; --surface: #ffffff; --surface-2: #f6f7fb; --line: #e3e6ef; --text: #161a25; --muted: #6b7288; --soft: #3d4356;
      --objection: #e8641f; --question: #1f7fe0; --signal: #10a870; --danger: #e04848;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14.5px/1.45 "Segoe UI Variable", "Segoe UI", "Inter", system-ui, sans-serif; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }

  /* Barre supérieure */
  .topbar { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); display: grid; place-items: center; }
  .brand small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: 0; }
  .live { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 5px 11px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .live.on { color: var(--signal); }
  .live.on .dot { background: var(--signal); box-shadow: 0 0 0 0 color-mix(in srgb, var(--signal) 60%, transparent); animation: ping 1.6s infinite; }
  @keyframes ping { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .rdv { font-size: 13px; color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46ch; }
  .spacer { flex: 1; }
  .meta { font-size: 12px; color: var(--muted); }
  .controls { display: flex; gap: 8px; align-items: center; }
  button, select { font: inherit; font-size: 13px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  body.kiosk .controls, body.kiosk .meta.mode { display: none; }

  /* Mise en page */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr minmax(260px, 32%); gap: 14px; padding: 14px; }
  .col { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 0; }
  .panel-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .scroll { overflow-y: auto; padding: 4px 16px 16px; flex: 1; min-height: 0; }

  /* Carte active */
  #cards { flex: 1; }
  .idle { flex: 1; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 30px; }
  .idle .wave { display: flex; gap: 5px; justify-content: center; height: 34px; align-items: center; margin-bottom: 12px; }
  .idle .wave i { width: 5px; height: 10px; border-radius: 3px; background: linear-gradient(var(--brand), var(--brand-2)); animation: eq 1.1s infinite ease-in-out; }
  .idle .wave i:nth-child(2) { animation-delay: .15s; } .idle .wave i:nth-child(3) { animation-delay: .3s; } .idle .wave i:nth-child(4) { animation-delay: .45s; } .idle .wave i:nth-child(5) { animation-delay: .6s; }
  @keyframes eq { 50% { height: 32px; } }
  .hero { --c: var(--brand); margin: 4px 16px 0; border-radius: 12px; background: var(--surface-2); border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 12%, transparent), 0 14px 40px -18px color-mix(in srgb, var(--c) 60%, transparent); padding: 16px 18px 14px; animation: enter .45s cubic-bezier(.2, .9, .3, 1.2); }
  .hero.objection, .hist.objection { --c: var(--objection); } .hero.question, .hist.question { --c: var(--question); } .hero.signal_achat, .hist.signal_achat { --c: var(--signal); }
  @keyframes enter { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); padding: 4px 10px; border-radius: 99px; }
  .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .hero-top .time { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hero h3 { margin: 10px 0 2px; font-size: 20px; letter-spacing: -.01em; }
  .say-l { margin-top: 12px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .say { font-size: 21px; line-height: 1.38; font-weight: 600; margin: 4px 0 12px; }
  .proof { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--soft); padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--c) 7%, transparent); }
  .ask { display: flex; gap: 10px; align-items: flex-start; margin-top: 8px; padding: 10px 12px; border-radius: 10px; border: 1px dashed color-mix(in srgb, var(--brand) 55%, var(--line)); font-size: 14px; }
  .ask b { color: var(--brand); display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .ico { flex: none; width: 18px; height: 18px; margin-top: 1px; }
  .src { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .src span { font-size: 11px; color: var(--muted); border: 1px solid var(--line); padding: 2px 8px; border-radius: 6px; }
  .history { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  .history-t { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .hist { --c: var(--brand); display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; background: var(--surface-2); border-left: 3px solid var(--c); font-size: 13px; animation: enter .35s; }
  .hist .t { flex: 1; font-weight: 600; } .hist .k { font-size: 11px; color: var(--c); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }

  /* Découverte */
  .disc-top { display: flex; align-items: center; gap: 14px; padding: 4px 16px 10px; }
  .ring { width: 58px; height: 58px; flex: none; }
  .ring circle { fill: none; stroke-width: 6; }
  .ring .bg { stroke: var(--line); } .ring .fg { stroke: var(--signal); stroke-linecap: round; transition: stroke-dashoffset .6s; transform: rotate(-90deg); transform-origin: center; }
  .ring text { fill: var(--text); font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  .nudge { flex: 1; font-size: 12.5px; color: var(--soft); }
  .nudge b { display: block; color: var(--brand); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .nudge.alert b { color: var(--danger); }
  .item { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 13px; }
  .item .box { width: 18px; height: 18px; flex: none; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; margin-top: 1px; transition: all .3s; }
  .item.ok .box { background: var(--signal); border-color: var(--signal); }
  .item.missing .box { border-color: var(--danger); }
  .item .lab { font-weight: 600; } .item.todo .lab { color: var(--muted); font-weight: 500; }
  .item .inf { font-size: 12px; color: var(--muted); }
  .item.missing .lab { color: var(--danger); }
  .item.flash { animation: flash 1.2s; border-radius: 8px; }
  @keyframes flash { 0% { background: color-mix(in srgb, var(--signal) 22%, transparent); } 100% { background: transparent; } }

  /* Transcription */
  #transcript { flex: 0 0 34%; }
  .line { padding: 5px 0; font-size: 13px; color: var(--soft); animation: enter .3s; }
  .line .who { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; }
  .line.commercial .who { color: var(--brand); } .line.prospect .who { color: var(--objection); }
  .line.flag { color: var(--text); }
  .line .st { font-size: 11px; color: var(--muted); margin-left: 4px; }

  /* Demi-écran à côté de Teams */
  @media (max-width: 1000px) {
    main { grid-template-columns: 1fr minmax(230px, 36%); gap: 12px; padding: 12px; }
    .say { font-size: 18px; } .hero h3 { font-size: 17px; } .hero { padding: 14px 15px 12px; }
    .rdv { max-width: 100%; order: 10; flex-basis: 100%; }
  }
  @media (max-width: 620px) {
    main { grid-template-columns: 1fr; }
    body { height: auto; }
    .panel { max-height: 75vh; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 9v6M16 4v16M20 10v4"/></svg></div>
    <div>Le Souffleur<small>Copilote de RDV découverte</small></div>
  </div>
  <span class="live" id="live"><span class="dot"></span><span id="liveTxt">Hors ligne</span></span>
  <span class="rdv" id="titre"></span>
  <span class="spacer"></span>
  <span class="meta" id="latence"></span>
  <span class="meta mode" id="mode"></span>
  <div class="controls">
    <select id="speed" title="Vitesse de la démo"><option value="1">×1</option><option value="2">×2</option><option value="4">×4</option></select>
    <button class="primary" id="btnDemo" disabled>Lancer la démo</button>
    <button id="btnStop" disabled>Stop</button>
  </div>
</header>
<main>
  <div class="col">
    <section class="panel" id="cards">
      <div class="panel-h"><span>Réponse guidée</span><span id="nbCards"></span></div>
      <div id="hero" class="idle"><div><div class="wave"><i></i><i></i><i></i><i></i><i></i></div>En attente du rendez-vous…<br><small>Les réponses aux questions et objections du prospect s'afficheront ici.</small></div></div>
      <div class="history" id="history" hidden><div class="history-t">Déjà traité</div></div>
    </section>
  </div>
  <div class="col">
    <section class="panel" id="discovery">
      <div class="panel-h"><span>Découverte</span></div>
      <div class="disc-top">
        <svg class="ring" viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="26"/><circle class="fg" id="ringFg" cx="32" cy="32" r="26" stroke-dasharray="163.4" stroke-dashoffset="163.4"/><text x="32" y="32" id="ringTxt">0/0</text></svg>
        <div class="nudge" id="nudge"></div>
      </div>
      <div class="scroll" id="items"></div>
    </section>
    <section class="panel" id="transcript">
      <div class="panel-h"><span>Transcription</span></div>
      <div class="scroll" id="lines"></div>
    </section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const params = new URLSearchParams(location.search);
if (params.has("kiosk")) document.body.classList.add("kiosk");
if (params.get("theme")) document.documentElement.dataset.theme = params.get("theme");

const TYPES = { objection: "Objection", question: "Question", signal_achat: "Signal d'achat" };
const ICON = {
  objection: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg>',
  question: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01"/></svg>',
  signal_achat: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6 4 4 6-8M20 7v5M20 7h-5"/></svg>',
  proof: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>',
  ask: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--brand)"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  check: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
};

let ws, labels = {}, etat = {}, latences = [], termine = false, t0 = 0, timer, cartes = [];

function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onmessage = (e) => handle(JSON.parse(e.data));
  ws.onclose = () => { setLive(false, "Reconnexion…"); $("btnDemo").disabled = true; setTimeout(connect, 1500); };
}
function setLive(on, txt) { $("live").classList.toggle("on", on); $("liveTxt").textContent = txt; }
const clock = () => { const s = Math.floor((Date.now() - t0) / 1000); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };

function handle(m) {
  if (m.type === "hello") {
    $("mode").textContent = { claude: `IA live · ${m.model}`, precalc: "Démo pré-calculée", mock: "Mode mots-clés" }[m.mode];
    setLive(false, "Prêt"); $("btnDemo").disabled = false;
  } else if (m.type === "session") {
    labels = m.checklist; etat = {}; latences = []; termine = false; cartes = [];
    $("titre").textContent = m.titre; $("lines").innerHTML = ""; $("latence").textContent = "";
    $("hero").className = "idle"; $("hero").innerHTML = '<div><div class="wave"><i></i><i></i><i></i><i></i><i></i></div>À l\'écoute du prospect…</div>';
    $("history").hidden = true; $("history").querySelectorAll(".hist").forEach((e) => e.remove()); $("nbCards").textContent = "";
    t0 = Date.now(); clearInterval(timer); timer = setInterval(() => setLive(true, `En écoute · ${clock()}`), 500); setLive(true, "En écoute · 00:00");
    renderChecklist(); $("btnStop").disabled = false;
  } else if (m.type === "replique") {
    const el = document.createElement("div");
    el.className = `line ${m.qui}`; el.id = `l${m.id}`;
    el.innerHTML = `<span class="who">${m.qui === "prospect" ? "Prospect" : "Vous"}</span>${esc(m.texte)}<span class="st"></span>`;
    $("lines").append(el); $("lines").scrollTop = $("lines").scrollHeight;
  } else if (m.type === "analyse") {
    const line = $(`l${m.id}`);
    if (m.carte) { line?.classList.add("flag"); if (line) line.querySelector(".st").textContent = " · 💡"; showCard(m); }
    etat = m.checklistEtat; renderChecklist(m.checklist.map((c) => c.item));
    latences.push(m.latenceMs); const s = [...latences].sort((a, b) => a - b);
    $("latence").textContent = `Réponse en ${(s[Math.floor(s.length / 2)] / 1000).toFixed(1)} s`;
  } else if (m.type === "erreur") {
    const line = $(`l${m.id}`); if (line) line.querySelector(".st").textContent = ` · ⚠ ${m.message}`;
  } else if (m.type === "fin") {
    clearInterval(timer); setLive(false, `Terminé · ${clock()}`); $("btnStop").disabled = true;
    termine = true; renderChecklist();
  }
}

function showCard(m) {
  const prev = cartes.at(-1);
  if (prev) {
    const h = document.createElement("div");
    h.className = `hist ${prev.declencheur}`;
    h.innerHTML = `<span class="t">${esc(prev.carte.titre)}</span><span class="k">${TYPES[prev.declencheur]}</span>`;
    $("history").querySelector(".history-t").after(h); $("history").hidden = false;
  }
  cartes.push({ ...m, at: clock() });
  $("nbCards").textContent = `${cartes.length} carte${cartes.length > 1 ? "s" : ""}`;
  const c = m.carte;
  $("hero").className = `hero ${m.declencheur}`;
  $("hero").innerHTML = `
    <div class="hero-top"><span class="chip">${ICON[m.declencheur] || ""}${TYPES[m.declencheur] || ""}</span><span class="time">${clock()} · ${(m.latenceMs / 1000).toFixed(1)} s</span></div>
    <h3>${esc(c.titre)}</h3>
    <div class="say-l">À dire</div>
    <div class="say">« ${esc(c.reponse)} »</div>
    ${c.preuve ? `<div class="proof">${ICON.proof}<span>${esc(c.preuve)}</span></div>` : ""}
    <div class="ask">${ICON.ask}<span><b>Question de rebond</b>${esc(c.question_rebond)}</span></div>
    <div class="src">${c.sources.map((s) => `<span>${esc(s)}</span>`).join("")}</div>`;
  // relance l'animation d'entrée
  $("hero").style.animation = "none"; void $("hero").offsetWidth; $("hero").style.animation = "";
}

function renderChecklist(nouveaux = []) {
  const keys = Object.keys(labels);
  const ok = keys.filter((k) => etat[k]).length;
  $("ringTxt").textContent = `${ok}/${keys.length}`;
  $("ringFg").style.strokeDashoffset = keys.length ? 163.4 * (1 - ok / keys.length) : 163.4;
  const manquants = keys.filter((k) => !etat[k]);
  $("nudge").className = `nudge ${termine && manquants.length ? "alert" : ""}`;
  $("nudge").innerHTML = !keys.length ? "" : manquants.length
    ? `<b>${termine ? "Non abordé" : "Pensez à demander"}</b>${esc(labels[manquants[0]])}${manquants.length > 1 ? ` <span style="color:var(--muted)">+${manquants.length - 1}</span>` : ""}`
    : "<b>Découverte complète</b>Tous les points sont couverts.";
  $("items").innerHTML = keys.map((k) => {
    const cls = etat[k] ? "ok" : termine ? "missing" : "todo";
    return `<div class="item ${cls} ${nouveaux.includes(k) ? "flash" : ""}"><div class="box">${etat[k] ? ICON.check : ""}</div><div><div class="lab">${esc(labels[k])}</div>${etat[k] ? `<div class="inf">${esc(etat[k])}</div>` : ""}</div></div>`;
  }).join("");
}

$("btnDemo").onclick = () => ws.send(JSON.stringify({ type: "demo", speed: $("speed").value }));
$("btnStop").onclick = () => ws.send(JSON.stringify({ type: "stop" }));
connect();
</script>
</body>
</html>

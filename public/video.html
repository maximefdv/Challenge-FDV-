<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Le Souffleur – mise en scène vidéo</title>
<!-- Page de démo : appel visio simulé (gauche) + Le Souffleur (droite), synchronisés sur le scénario du serveur. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #0f1217; font: 15px/1.4 "Segoe UI", system-ui, sans-serif; color: #e7eaf0; display: flex; }
  #visio { width: 540px; display: flex; flex-direction: column; background: #1b1d24; border-right: 1px solid #2a2e38; }
  .bar { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #24262f; font-size: 13px; color: #b9bfcc; }
  .rec { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .timer { margin-left: auto; font-variant-numeric: tabular-nums; }
  .tiles { flex: 1; display: grid; grid-template-rows: 1fr 1fr; gap: 10px; padding: 12px; }
  .tile { position: relative; border-radius: 12px; background: #2a2d37; display: grid; place-items: center; border: 3px solid transparent; transition: border-color .2s, box-shadow .2s; }
  .tile.speaking { border-color: #7c83ff; box-shadow: 0 0 0 4px rgba(124, 131, 255, .25); }
  .avatar { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; font-size: 34px; font-weight: 700; color: #fff; }
  .name { position: absolute; left: 12px; bottom: 10px; font-size: 13px; background: rgba(0, 0, 0, .45); padding: 3px 9px; border-radius: 6px; }
  .wave { position: absolute; right: 14px; bottom: 12px; display: flex; gap: 3px; align-items: flex-end; height: 18px; opacity: 0; }
  .tile.speaking .wave { opacity: 1; }
  .wave i { width: 4px; background: #7c83ff; border-radius: 2px; animation: wave .6s infinite ease-in-out; }
  .wave i:nth-child(2) { animation-delay: .15s; } .wave i:nth-child(3) { animation-delay: .3s; }
  @keyframes wave { 0%, 100% { height: 4px; } 50% { height: 18px; } }
  .subs { min-height: 96px; margin: 0 12px 12px; padding: 12px 14px; border-radius: 10px; background: rgba(0, 0, 0, .55); font-size: 16px; }
  .subs .who { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 3px; }
  .subs .who.commercial { color: #a5b4fc; } .subs .who.prospect { color: #fdba74; }
  .controls { height: 52px; display: flex; justify-content: center; align-items: center; gap: 14px; background: #24262f; }
  .controls span { width: 38px; height: 38px; border-radius: 50%; background: #3a3d48; display: grid; place-items: center; font-size: 16px; }
  .controls .hang { background: #dc2626; }
  #souffleur { flex: 1; position: relative; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  .callout { position: absolute; left: 50%; bottom: 22px; transform: translate(-50%, 20px); background: #4f46e5; color: #fff; font-weight: 600; padding: 9px 16px; border-radius: 99px; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); opacity: 0; transition: all .4s; white-space: nowrap; }
  .callout.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="visio">
  <div class="bar"><span class="rec"></span> Visio · RDV découverte <span class="timer" id="timer">00:00</span></div>
  <div class="tiles">
    <div class="tile" id="tile-prospect"><div class="avatar" style="background:#c2410c">CM</div><span class="name">Claire Martin · prospect</span><div class="wave"><i></i><i></i><i></i></div></div>
    <div class="tile" id="tile-commercial"><div class="avatar" style="background:#4338ca">MA</div><span class="name">Maxime · commercial (vous)</span><div class="wave"><i></i><i></i><i></i></div></div>
  </div>
  <div class="subs" id="subs"></div>
  <div class="controls"><span>🎤</span><span>📷</span><span>🖥️</span><span class="hang">📞</span></div>
</div>
<div id="souffleur">
  <iframe id="app" src="/"></iframe>
  <div class="callout" id="callout">💡 Réponse guidée affichée au commercial en temps réel</div>
</div>
<script>
const app = document.getElementById("app");
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

async function ready() {
  await new Promise((ok) => (app.contentDocument?.readyState === "complete" ? ok() : app.addEventListener("load", ok, { once: true })));
  const btn = () => app.contentDocument.getElementById("btnDemo");
  while (!btn() || btn().disabled) await new Promise((ok) => setTimeout(ok, 100));
}

window.start = async () => {
  const { repliques } = await (await fetch("/api/scenario")).json();
  app.contentDocument.getElementById("btnDemo").click();
  const t0 = Date.now();
  setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); document.getElementById("timer").textContent = `00:${String(s).padStart(2, "0")}`; }, 250);
  repliques.forEach((r, i) => setTimeout(() => {
    document.querySelectorAll(".tile").forEach((el) => el.classList.remove("speaking"));
    document.getElementById(`tile-${r.qui}`).classList.add("speaking");
    document.getElementById("subs").innerHTML = `<div class="who ${r.qui}">${r.qui === "prospect" ? "Claire Martin" : "Maxime"}</div>${esc(r.texte)}`;
    const next = repliques[i + 1];
    setTimeout(() => document.getElementById(`tile-${r.qui}`).classList.remove("speaking"), next ? next.t - r.t - 300 : 2500);
  }, r.t));
  // Bulle d'explication dès qu'une carte apparaît dans le Souffleur
  const obs = new MutationObserver(() => {
    if (app.contentDocument.querySelector(".card")) { document.getElementById("callout").classList.add("show"); obs.disconnect(); }
  });
  obs.observe(app.contentDocument.getElementById("cards"), { childList: true });
};

window.appReady = ready();
if (!navigator.webdriver) window.appReady.then(() => window.start());
</script>
</body>
</html>
